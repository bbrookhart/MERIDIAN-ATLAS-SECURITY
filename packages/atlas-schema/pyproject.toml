[project]
name = "atlas-schema"
version = "0.1.0"
description = "Shared Finding schema and OWASP taxonomy tables — the contract every package in the portfolio reads and writes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
