# Vulnerability scanning config for the AI-BOM
# (evidence/assurance/atlas_ai_bom.json, generated by atlas-assurance).
#
# CI fails on any *fixable* vulnerability at medium or above. Accepted
# exceptions are listed here with a reason, because an unexplained
# suppression is indistinguishable from a missed finding.

ignore:
  # GHSA-w8v5-vhqr-4h9v — DiskCache unsafe pickle deserialization (Medium).
  #
  # Found by the first genuinely working run of this scanner (the BOM
  # previously carried no PURLs, so every scan reported a false clean —
  # see bom.py::_library_components).
  #
  # Accepted, with reasoning:
  #   - No fixed version exists upstream (grype reports state=not-fixed),
  #     so there is nothing to upgrade to.
  #   - Reached only via pysigma -> pysigma-backend-clickhouse ->
  #     atlas-detect's *dev* dependency group. It is not in the runtime
  #     closure of atlas, atlas-control, or any published container image
  #     (verified: `uv tree --package atlas-detect --no-dev`).
  #   - Exploitation requires an attacker to control the contents of the
  #     cache DiskCache deserializes. In this repo that cache is written
  #     only by pySigma's own rule compilation on a developer machine or
  #     CI runner, from rule files committed in this repository.
  #
  # Revisit if pysigma ships a fix, or if anything moves Sigma rule
  # compilation into a runtime service path.
  - vulnerability: GHSA-w8v5-vhqr-4h9v
