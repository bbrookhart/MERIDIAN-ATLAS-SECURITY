# Same two deterministically-seeded probes as agent-baseline.yaml, at the
# spec's default full-suite trial count (20) instead of 5. At N=5, a 0/5
# result classifies as "flaky" (too little data to be confident it's a
# real zero rather than luck) rather than "probabilistic" — this suite
# exists to get a statistically confident zero before promoting these
# findings into atlas-redteam's regression baseline. garak/PyRIT probes
# are intentionally excluded here: they aren't seeded per-trial (see
# adapters' docstrings) so more trials wouldn't make their numbers any
# more attributable to a code change.
name: agent-baseline-highn
trials: 20
seed: 1337
probes:
  - tool: excessive-agency-probe
    probe_name: refund-threshold-bypass
    amount: 50000.0
    taxonomy:
      - framework: owasp_llm_2026
        id: "LLM03:2026"
      - framework: owasp_asi_2026
        id: "ASI02"

  - tool: memory-probe
    probe_name: cross-session-memory-leak
    taxonomy:
      - framework: owasp_asi_2026
        id: "ASI06"
