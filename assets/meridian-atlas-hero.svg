<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380"
     role="img" aria-labelledby="title desc">
  <title id="title">MERIDIAN ATLAS — Adversarial AI Security and Control Assurance</title>
  <desc id="desc">Programme wordmark over an engineering schematic tracing the evidence
  lifecycle from attack through control, retest, detection, and assurance. A claim and
  evidence gate marks the center of the system.</desc>

  <defs>
    <!-- The same process-drawing grid used across the research portfolio. -->
    <pattern id="ma-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2733" stroke-width="1"/>
    </pattern>
    <linearGradient id="ma-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A3A4A" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#4A6076"/>
      <stop offset="0.85" stop-color="#4A6076"/>
      <stop offset="1" stop-color="#2A3A4A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ma-chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6873B"/>
      <stop offset="0.5" stop-color="#7E93A8"/>
      <stop offset="1" stop-color="#4E9C87"/>
    </linearGradient>
  </defs>

  <!-- Self-contained ground keeps the hero consistent in light and dark README themes. -->
  <rect width="1200" height="380" fill="#0B1017"/>
  <rect width="1200" height="380" fill="url(#ma-grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none"
        stroke="#22303D" stroke-width="1"/>

  <!-- A restrained cartographic datum distinguishes Meridian Atlas without
       breaking the engineering visual language established by BLACKSTART. -->
  <g fill="none" stroke="#314354" stroke-width="1" opacity="0.34">
    <circle cx="600" cy="176" r="142"/>
    <ellipse cx="600" cy="176" rx="50" ry="142"/>
    <ellipse cx="600" cy="176" rx="103" ry="142"/>
    <path d="M458 176H742"/>
    <path d="M477 106H723M477 246H723"/>
    <path d="M600 22V356" stroke-dasharray="2 9"/>
  </g>

  <!-- Corner registration marks -->
  <g stroke="#3A4E60" stroke-width="1.5" fill="none">
    <path d="M28 20V44M20 28H44"/>
    <path d="M1172 20V44M1180 28H1156"/>
    <path d="M28 360V336M20 352H44"/>
    <path d="M1172 360V336M1180 352H1156"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="122" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="12" fill="#EAF1F7">MERIDIAN ATLAS</text>

  <line x1="278" y1="154" x2="922" y2="154" stroke="url(#ma-rule)" stroke-width="1"/>

  <text x="600" y="187" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14.5" letter-spacing="4.8" fill="#8FA6BB">ADVERSARIAL AI SECURITY / CONTROL ASSURANCE</text>

  <text x="600" y="223" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="600" letter-spacing="3.4" fill="#C6873B">NO CLAIM WITHOUT EVIDENCE.</text>

  <!-- Evidence lifecycle: the repository attacks a target, imposes controls,
       retests those controls, measures detection, and admits only supported claims. -->
  <g transform="translate(0,300)">
    <line x1="150" y1="0" x2="1050" y2="0" stroke="url(#ma-chain)" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="12.5" letter-spacing="3.2" text-anchor="middle">
      <circle cx="150" cy="0" r="6.5" fill="#0B1017" stroke="#C6873B" stroke-width="2"/>
      <text x="150" y="30" fill="#B9793A">ATTACK</text>

      <circle cx="375" cy="0" r="6.5" fill="#0B1017" stroke="#8B94A0" stroke-width="2"/>
      <text x="375" y="30" fill="#8FA6BB">CONTROL</text>

      <circle cx="600" cy="0" r="6.5" fill="#0B1017" stroke="#A9BDD0" stroke-width="2"/>
      <text x="600" y="30" fill="#A9BDD0">RETEST</text>

      <circle cx="825" cy="0" r="6.5" fill="#0B1017" stroke="#6E93A8" stroke-width="2"/>
      <text x="825" y="30" fill="#8FA6BB">DETECT</text>

      <circle cx="1050" cy="0" r="6.5" fill="#0B1017" stroke="#4E9C87" stroke-width="2"/>
      <text x="1050" y="30" fill="#4E9C87">ASSURE</text>
    </g>

    <!-- The evidence gate is the project's thesis: unsupported control claims
         fail closed rather than entering the assurance record. -->
    <g transform="translate(600,0)">
      <line x1="0" y1="-24" x2="0" y2="-7" stroke="#5B7186" stroke-width="1.4"/>
      <rect x="-98" y="-50" width="196" height="26" rx="3"
            fill="#101922" stroke="#5B7186" stroke-width="1.4"/>
      <text x="0" y="-32" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10.5" letter-spacing="1.7" fill="#A9BDD0">CLAIM / EVIDENCE GATE</text>
    </g>
  </g>
</svg>
