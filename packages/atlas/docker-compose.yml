networks:
  atlas_internal:
    internal: true # postgres + both MCP servers + atlas-control + seed: no route out, ever
  atlas_egress: {}   # only atlas-api, atlas-control, and seed join this, solely to reach host Ollama
  # Real Docker behavior discovered live while wiring Project 4: a
  # container attached *only* to an `internal: true` network never gets
  # its `ports:` mapping forwarded from the host, even though the
  # directive is accepted with no error — confirmed by attaching a second
  # non-internal network to a running container and watching `docker port`
  # start reporting the mapping. clickhouse/otel-collector need host access
  # (for test_redaction.py and the replay/scoring/dashboard scripts) but
  # not actual internet egress, so they get their own network rather than
  # joining atlas_egress (which is scoped to "needs to reach host Ollama").
  atlas_observability: {}

services:
  postgres:
    image: pgvector/pgvector:pg16
    networks: [atlas_internal]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp-ticketing:
    build:
      context: ../..
      dockerfile: packages/atlas/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ["atlas-mcp-ticketing"]
    networks: [atlas_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8801), timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp-docstore:
    build:
      context: ../..
      dockerfile: packages/atlas/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ["atlas-mcp-docstore"]
    networks: [atlas_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8802), timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    networks: [atlas_internal, atlas_observability]
    ports:
      - "127.0.0.1:8123:8123" # HTTP interface — replay/scoring/dashboard scripts query from the host
    environment:
      CLICKHOUSE_DB: otel
      # Lab-only credential (matches the postgres atlas/atlas convention
      # elsewhere in this compose file) — the image disables network
      # access for the default user entirely unless a password is set.
      CLICKHOUSE_PASSWORD: atlas
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    networks: [atlas_internal, atlas_observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../atlas-detect/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP — also used directly by test_redaction.py from the host
    depends_on:
      clickhouse:
        condition: service_healthy

  seed:
    build:
      context: ../..
      dockerfile: packages/atlas/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ["atlas-seed"]
    restart: "no"
    networks: [atlas_internal, atlas_egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: &atlas_env
      ATLAS_DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
      ATLAS_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ATLAS_CONTROL_BASE_URL: http://atlas-control:8100
      # Runtime-overridable (default "pre") — lets the Phase C latency/
      # recall benchmark exercise both filter strategies against the same
      # running stack without a rebuild.
      ATLAS_RETRIEVAL_MODE: ${ATLAS_RETRIEVAL_MODE:-pre}
      ATLAS_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy

  atlas-control:
    build:
      context: ../..
      dockerfile: packages/atlas-control/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    networks: [atlas_internal, atlas_egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ATLAS_CONTROL_DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
      ATLAS_CONTROL_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ATLAS_CONTROL_MCP_TICKETING_URL: http://mcp-ticketing:8801/mcp
      ATLAS_CONTROL_MCP_DOCSTORE_URL: http://mcp-docstore:8802/mcp
      ATLAS_CONTROL_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      mcp-ticketing:
        condition: service_healthy
      mcp-docstore:
        condition: service_healthy
      otel-collector:
        condition: service_started

  atlas-api:
    build:
      context: ../..
      dockerfile: packages/atlas/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    networks: [atlas_internal, atlas_egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: *atlas_env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      atlas-control:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
