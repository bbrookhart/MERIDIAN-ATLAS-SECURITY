name: atlas-assurance

# This is the "evidence generated by CI, not written by hand" loop
# atlas-assurance's own README argues for, actually closing: before this
# workflow existed, neither atlas-control's nor atlas-retrieval's pytest
# suite, nor their OPA policy tests, ran anywhere except by hand on a
# developer's machine (confirmed live while building this project — the
# only other workflow, atlas-redteam.yml, never touched them). This
# workflow is what makes that evidence real and refreshable rather than
# aspirational.

on:
  pull_request:
    paths:
      - "packages/atlas/**"
      - "packages/atlas-control/**"
      - "packages/atlas-retrieval/**"
      - "packages/atlas-redteam/**"
      - "packages/atlas-assurance/**"
      - "packages/atlas-schema/**"
  schedule:
    # Nightly, 04:00 UTC — this is what actually keeps evidence "fresh"
    # in the max_age_days sense; a broken nightly run is itself a real
    # staleness signal, not a formality.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

env:
  UV_VERSION: "0.11.18"

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Sync workspace
        run: uv sync --package atlas-assurance

      - name: Check AI-BOM for unexpected drift
        run: |
          uv run --package atlas-assurance python \
            packages/atlas-assurance/scripts/check_bom_drift.py

      - name: Build control register and reports
        run: |
          uv run --package atlas-assurance python \
            packages/atlas-assurance/scripts/build_register.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-assurance-evidence-${{ github.run_id }}
          path: |
            evidence/assurance/
            evidence/reports/atlas_assurance_report.html
            evidence/reports/atlas_assurance_executive_summary.html
            evidence/reports/atlas_assurance_trend.html
          retention-days: 30
