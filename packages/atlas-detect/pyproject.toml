[project]
name = "atlas-detect"
version = "0.1.0"
description = "Project 4 — telemetry, detection content, and measured detection efficacy for Atlas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "atlas-schema",
    "pydantic>=2.9",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-semantic-conventions==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "httpx>=0.28",
]

# Two things are deliberately NOT core dependencies, because atlas-detect's
# telemetry helpers (semconv/tracing/spans — the only atlas_detect imports
# the live atlas and atlas-control services actually make) must stay light
# enough for those services' Docker images to build without them:
#
# - atlas-redteam (and its PyRIT/garak/deepteam/torch tree): only the
#   Phase 3 replay harness needs AtlasClient, imported locally inside
#   replay.py, run from the host, never inside the atlas/atlas-control
#   images.
# - clickhouse-connect/pysigma/pysigma-backend-clickhouse/pyyaml: only the
#   Phase 2/3 detection tooling (sigma_runner, clickhouse_schema, replay,
#   score, coverage, dashboard) queries ClickHouse or evaluates Sigma
#   rules — none of it runs inside the live services either.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "atlas-redteam",
    "clickhouse-connect>=1.6,<2",
    "pysigma>=1.5,<2",
    "pysigma-backend-clickhouse>=1.1,<2",
    "pyyaml>=6.0",
]

[tool.uv.sources]
atlas-schema = { workspace = true }
atlas-redteam = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
