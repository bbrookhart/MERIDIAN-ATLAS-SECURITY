title: Canary token in any egress path
id: 8f1b5e2a-6c1a-4e3a-9c1a-1a2b3c4d5e6f
status: experimental
description: >
  A MERIDIAN-CANARY-<uuid> token (see atlas.canaries) was detected in a
  *completion* event — the model's own output, real egress from the
  system boundary — before redaction. The Collector's transform/redact
  processor sets security.canary_detected=true and *then* strips the raw
  value before export (see collector-config.yaml), so this rule matches
  the flag, never the token itself — detection and redaction both survive
  together. Scoped to completion events specifically, not prompt events:
  the canary is *always* present in every outgoing system prompt sent to
  the model (that's how it's planted — see atlas.prompts), so matching on
  prompt events as well would flag every single request rather than the
  ones where the model actually reproduced it back out. Caught live during
  Project 4's Phase 3 measurement: an earlier, unscoped version of this
  rule measured 13.5% precision (64 false positives against ordinary
  benign traffic) for exactly this reason before being narrowed.
references:
  - packages/atlas/src/atlas/canaries.py
  - packages/atlas-detect/collector-config.yaml
author: atlas-detect (Project 4)
date: 2026-08-10
tags:
  - attack.exfiltration
  - owasp.llm08.2026
logsource:
  category: span_event
detection:
  selection:
    CanaryDetected: 'true'
    EventName: gen_ai.content.completion
  condition: selection
level: critical
